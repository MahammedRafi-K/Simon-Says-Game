<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Simon Says Colors Game</title>
</head>
<body>
    <h1>Simons Says Colors Game</h1>
    <h3>Click any key to start the game</h3>
    <div class="main-container">
        <div class="first">
            <div class="buttons red" type="button" id="red"></div>
            <div class="buttons orange" type="button" id="orange"></div>
        </div>
        <div class="second">
            <div class="buttons yellow" type="button" id="yellow"></div>
            <div class="buttons blue" type="button" id="blue"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
